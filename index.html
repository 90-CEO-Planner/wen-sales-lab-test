<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WEN Sales Lab (test build)</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1f2937;--mute:#5b6472;--line:#e3dfd9;--acc:#0b7a83;--acc2:#e9f6f7;--warn:#8a5a00;--warnbg:#fff6e0;--bad:#9b1c1c;--badbg:#fdeaea;--ok:#146c43;--okbg:#e6f5ec}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.banner{background:#2b2f36;color:#fff;font-size:13px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.banner button{background:#fff;color:#2b2f36;border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:16px 0 6px}
p{margin:6px 0}.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:15px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.sm{min-height:34px;padding:5px 10px;font-size:14px}
.chip[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:200px;line-height:1.45}
label{display:block;font-weight:600;margin:12px 0 4px}
.lesson{background:var(--acc2);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;margin:10px 0}
.lesson p{margin:8px 0}
.ex{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--mute)}
.note{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}.note.ok{background:var(--okbg);color:var(--ok)}.note.info{background:var(--acc2)}
.step{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card);text-decoration:none;color:var(--ink)}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.step.done .n{background:var(--acc);color:#fff}
.step .t{flex:1}.step .tt{font-weight:600}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.crow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;flex-wrap:wrap}
.score{font-weight:700}
.q{margin:14px 0}.q .row{margin-top:6px}
.back{display:inline-block;margin:4px 0;color:var(--acc)}
.tabs{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.banner a{color:#fff;font-size:13px;text-decoration:underline;padding:6px}
.stat{flex:1;min-width:110px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.stat b{display:block;font-size:26px}
.pk{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:15px}
.clock{background:#2b2f36;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0}
.clock .chip{min-height:30px;padding:3px 9px;font-size:13px}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){main{max-width:1000px}.two{grid-template-columns:1fr 1fr}}
.glance{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0}.glance p{margin:6px 0;font-size:15px}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}

.hero{background:var(--acc);color:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hero .kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hero h2{font-size:22px;margin:6px 0 4px}.hero p{margin:6px 0}
.hero .btn{display:block;width:100%;text-align:center;background:#fff;color:#0b5f66;font-weight:700;font-size:18px;margin-top:12px;padding:14px}
.hero .bar{background:rgba(255,255,255,.35)}.hero .bar i{background:#fff}

.step.next{border:2px solid var(--acc);background:var(--acc2)}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:4px 0 8px}
.pill{font-size:13px;border-radius:999px;padding:4px 12px;border:1px solid var(--line);background:var(--card)}
.pill.ok{color:var(--ok);background:var(--okbg)}.pill.warn{color:var(--warn);background:var(--warnbg)}.pill.info{color:var(--mute)}
details summary{cursor:pointer;padding:6px 0}
input[type=email],input[type=password]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.chip[disabled]{opacity:.45}
/* Group A accessibility fixes (12 Nov 2026) and Teal Forward design (12 Nov 2026, Jen's choice, WEN Brand Guide v1.0) */
@font-face{font-family:"Poppins";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/poppins-600.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/poppins-700.woff2) format("woff2")}
@font-face{font-family:"Open Sans";font-weight:400 600;font-style:normal;font-display:swap;src:url(fonts/opensans-var.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/montserrat-700.woff2) format("woff2")}
:root{--bg:#F5F2EE;--card:#fff;--ink:#1B1B1B;--mute:#5A5249;--line:#E4DDD3;--acc:#00C2CB;--acc2:#DDF6F7;--ok:#1B1B1B;--okbg:#DDF6F7;--warn:#1B1B1B;--warnbg:#FDF3CC;--bad:#7A1020;--badbg:#FCE9EC;--link:#00707A;--focus:#000;--field:#767676;--blush:#FCE9EC;--yellow:#F2C21D;--yellowtint:#FDF3CC;--brown:#967E61}

body{font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif}h1{font-weight:700}h2,h3{font-weight:600}
.banner{background:#00C2CB;color:#000}.banner a{color:#000}.banner button{background:#000;color:#F5F2EE}
.btn{background:#000;color:#F5F2EE;border-radius:12px;font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.chip{border-color:var(--brown)}
.chip[aria-pressed=true]{background:#000;color:#F2C21D;border-color:#000}
.back,.mute a,a.link,p a,.glance a{color:var(--link)}
.lesson{background:var(--acc2);border-left-color:#00C2CB}
.hero{background:#00C2CB;color:#000;border-radius:16px;box-shadow:none}
.hero .kicker{font-family:Montserrat,system-ui,sans-serif;opacity:1}
.hero h2{font-weight:700}
.hero .btn{background:#000;color:#fff;font-size:15px}
.hero .bar{background:rgba(0,0,0,.2)}.hero .bar i{background:#000}
.bar i{background:#00C2CB}
.step .n{color:#000}
.step.g1 .n{background:var(--blush)}.step.g2 .n{background:#00C2CB}.step.g3 .n{background:var(--yellow)}
.step.done .n{background:#000;color:#F2C21D}
h3.grp{font:700 11px Montserrat,system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;margin:16px 0 4px;padding-left:8px;border-left:5px solid;color:var(--ink)}
h3.grp.g1l{border-color:var(--blush)}h3.grp.g2l{border-color:#00C2CB}h3.grp.g3l{border-color:var(--yellow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.tile{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;line-height:1.25;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.tile b{font:700 26px/1.1 Poppins,system-ui,sans-serif}.tile .ti{display:block;color:var(--ink)}
.card{position:relative}
.ci{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg)}
.signlogo{display:block;margin:0 auto 10px}
.banner{display:flex;flex-wrap:nowrap;align-items:center;gap:10px}.banner span{flex:1}.blogo{background:#fff;border-radius:50%;padding:2px;flex:none}
.step.next{border:2px solid #00C2CB;background:var(--yellowtint)}
.pill.ok{color:var(--ok);background:var(--okbg)}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hero :focus-visible,.banner :focus-visible{outline-color:#000}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{border-color:var(--field)}
/* Craft polish (12 Nov 2026, frontend-design pass). Spacing, type scale, card depth, states. No wording, no new colours, no dark mode. */
:root{--shadow:0 1px 2px rgba(27,27,27,.05),0 8px 20px -12px rgba(27,27,27,.18);--shadow-up:0 2px 4px rgba(27,27,27,.06),0 12px 24px -12px rgba(27,27,27,.22);--ease:cubic-bezier(.2,.7,.2,1)}
html{-webkit-text-size-adjust:100%}
body{line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:#00C2CB;color:#000}
main{padding:20px 16px 56px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.015em;margin:10px 0 4px}
h2{font-size:19px;line-height:1.3;letter-spacing:-.005em;margin:0 0 10px}
h3{font-size:16px;line-height:1.35}
p{max-width:68ch}
.mute{line-height:1.5}
.banner{font-size:13px;padding:7px 16px;min-height:40px}
.banner span{line-height:1.35}
.banner button{border-radius:8px;padding:6px 12px;font-weight:600;transition:background .15s var(--ease)}
.banner button:hover{background:#1b1b1b}
.back{padding:6px 0;font-weight:600;text-underline-offset:3px}
.back:hover,p a:hover,.mute a:hover,a.link:hover,.glance a:hover{text-decoration-thickness:2px}
.card{border-radius:16px;padding:20px;margin:16px 0;box-shadow:var(--shadow);border-color:#E9E3DA}
.card .row{gap:10px}
.btn{padding:13px 20px;min-height:46px;line-height:1.2;transition:background .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:hover{background:#262626;transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.btn:active{transform:translateY(0);box-shadow:none;background:#000}
.btn.ghost{box-shadow:none}
.btn.ghost:hover{background:#000;color:#F5F2EE;box-shadow:none}
.btn[disabled],.btn[disabled]:hover{transform:none;box-shadow:none;background:#000}
.btn.ghost[disabled],.btn.ghost[disabled]:hover{background:transparent;color:var(--ink)}
.hero{padding:22px 20px 20px;margin:18px 0;border-radius:20px}
.hero h2{font-size:23px;line-height:1.25;letter-spacing:-.01em;margin:8px 0 6px}
.hero p{max-width:46ch;line-height:1.5}
.step .t{line-height:1.4}
.hero .kicker{font-size:12px;letter-spacing:.1em}
.hero .bar{height:8px;margin-top:14px}
.hero .btn:hover{background:#262626}
.bar{height:8px}.bar i{transition:width .5s var(--ease)}
.chip{padding:9px 14px;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.chip:hover:not([disabled]):not([aria-pressed=true]){border-color:#000;background:#FBFAF8}
.chip:active:not([disabled]){transform:scale(.98)}
.chip[aria-pressed=true]{box-shadow:inset 0 0 0 1px #000}
.chip.sm{padding:6px 12px}
label{font-weight:600;font-size:15px;margin:16px 0 6px}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{padding:12px 14px;border-radius:12px;border-width:1.5px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input[type=text]:hover,input[type=number]:hover,input[type=email]:hover,input[type=password]:hover,select:hover,textarea:hover{border-color:#1B1B1B}
input[type=text]:focus,input[type=number]:focus,input[type=email]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:#000;box-shadow:0 0 0 4px rgba(0,194,203,.28)}
textarea{line-height:1.55}
.lesson{border-radius:12px;padding:14px 16px;border-left-width:5px}
.ex{border-radius:12px;padding:12px 14px;border-color:#D9D1C5;background:#FBFAF8}
.note{border-radius:12px;padding:12px 14px;line-height:1.5}
.note.info,.note.ok{border:1px solid #BFE9EC}
.note.warn{border:1px solid #F0DD9A}
.note.bad{border:1px solid #F0C4CB}
.pill{padding:3px 12px;font-weight:600;font-size:12.5px}
.glance{border-radius:14px;padding:10px 16px;box-shadow:var(--shadow)}
.crow{border-radius:12px;padding:12px 14px;border-color:#E9E3DA;transition:border-color .15s var(--ease)}
.crow:hover{border-color:#cfc6b8}
/* long email addresses and names wrap instead of running off a phone screen (13 Nov, from Jen phone check) */
.crow,.crow span,.crow p,.card p,.card h2,.card h3,.card label{overflow-wrap:anywhere}
.pk{border-radius:12px}
.step{border-radius:14px;padding:14px;gap:14px;margin:10px 0;border-color:#E9E3DA;box-shadow:0 1px 2px rgba(27,27,27,.04);transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease)}
.step:hover{transform:translateY(-1px);box-shadow:var(--shadow-up);border-color:#1B1B1B}
.step:active{transform:translateY(0);box-shadow:none}
.step .n{width:36px;height:36px;font-family:Poppins,system-ui,sans-serif;font-weight:600}
.step .tt{line-height:1.35}
.step.next{box-shadow:var(--shadow)}
h3.grp{margin:22px 0 6px}
.tiles{gap:10px;margin:10px 0 4px}
.tile{border-width:1.5px;padding:14px 6px 12px;border-radius:16px;gap:4px}
.tile b{font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ci{width:36px;height:36px;right:16px;top:16px}
.card:has(>.ci) h2{padding-right:48px}
.signlogo{margin:6px auto 14px}
.score{font-variant-numeric:tabular-nums}
details summary{padding:8px 0;font-weight:600}
@media(min-width:760px){main{padding-top:28px}h1{font-size:32px}.card{padding:24px}.hero{padding:28px 28px 26px}.hero h2{font-size:27px}.hero .btn{display:inline-block;width:auto;min-width:260px}}
@media(max-width:380px){main{padding-left:14px;padding-right:14px}.card{padding:16px}.btn{padding:12px 16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

:root{color-scheme:light}

/* Community (M3C-b) */
.cmeta{color:var(--mute);font-size:14px;margin:4px 0}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--line);background:var(--card)}.av.big{width:80px;height:80px;margin:0}
a.post{display:block;text-decoration:none;color:var(--ink)}a.post h2{margin:0 0 4px}a.post:hover h2{text-decoration:underline;text-underline-offset:3px}
a.chip{text-decoration:none;display:inline-flex;align-items:center}
.pill.new{background:#000;color:#F2C21D;border-color:#000;font-weight:700;letter-spacing:.04em}
.com-body{overflow-wrap:anywhere;line-height:1.6}
.com-reply{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.com-reply:first-child{border-top:0;margin-top:0;padding-top:0}
.com-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#F2C21D;border:2px solid #000;margin-left:8px;vertical-align:middle}
textarea.com{min-height:150px}
/* Redesign R1 (14 Nov 2026, Jen's approved hybrid): shared design system. Presentation only: no wording, no logic.
   Type: Bricolage Grotesque (display), Instrument Sans (reading), Instrument Serif italic (voice). All SIL OFL 1.1, self-hosted.
   Colour: petrol ink on cool paper, WEN teal, WEN yellow, blush, with coral kept for "you are here". */
@font-face{font-family:"Bricolage Grotesque";font-weight:300 800;font-stretch:75% 100%;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-var.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:400 700;font-style:normal;font-display:swap;src:url(fonts/instrument-sans-var.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/instrument-serif-italic.woff2) format("woff2")}
:root{--bg:#EEF0ED;--card:#fff;--ink:#0F2A2D;--mute:#3F5856;--line:#C2CECB;--acc:#00C2CB;--acc2:#D5F3F5;--ok:#0F2A2D;--okbg:#D5F3F5;--warn:#0F2A2D;--warnbg:#FBEFC2;--bad:#7A1020;--badbg:#FCE9EC;--link:#0F2A2D;--focus:#0F2A2D;--field:#0F2A2D;--blush:#FCE9EC;--yellow:#F2C21D;--yellowtint:#FBEFC2;--brown:#0F2A2D;--teal:#00C2CB;--gold:#F2C21D;--coral:#E4572E;--disp:"Bricolage Grotesque",system-ui,sans-serif;--text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--shadow:none;--shadow-up:none}
body{font-family:var(--text);font-size:17px;line-height:1.55;background:var(--bg);color:var(--ink)}
::selection{background:var(--teal);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:22px clamp(18px,4.5vw,64px) 90px}
h1,h2,h3{font-family:var(--disp);color:var(--ink)}
h1{font-weight:700;font-stretch:78%;font-size:clamp(2.1rem,4.4vw,3.3rem);line-height:1;letter-spacing:-.025em;margin:16px 0 10px;max-width:22ch;text-wrap:balance}
h2{font-weight:600;font-size:clamp(1.3rem,2vw,1.7rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 10px}
h3{font-weight:600;font-size:1.1rem;line-height:1.25}
p{max-width:68ch}
.mute{color:var(--mute);font-size:15px}
h1+p.mute{font-size:18px;line-height:1.5}
a{color:var(--ink)}
.back,.mute a,a.link,p a,.glance a{color:var(--ink);text-underline-offset:4px}
.back{font-weight:500;font-size:15px}
a.link{font-weight:600;text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* test-build strip: quiet, so the colour band below it leads */
.banner{background:#0F2A2D;color:#EEF0ED}.banner a{color:#EEF0ED}.banner button{background:#EEF0ED;color:#0F2A2D}.banner button:hover{background:#fff}
.banner :focus-visible{outline-color:#EEF0ED}
.topbar{font-size:14px;margin:0 0 4px}
.pill{border-radius:3px;border:1.5px solid var(--ink);background:transparent;font-size:12px;font-weight:600;padding:3px 8px}
.pill.ok{background:var(--acc2);color:var(--ink)}.pill.warn{background:var(--warnbg);color:var(--ink)}.pill.info{color:var(--mute);border-color:var(--line)}
.pill.new{background:var(--gold);color:var(--ink);border-color:var(--ink);letter-spacing:0}

/* sections: a thick rule and a heading in place of boxed cards */
.card{background:transparent;border:0;border-top:3px solid var(--ink);border-radius:0;box-shadow:none;padding:14px 0 4px;margin:34px 0}
.card h2{margin-bottom:10px}
.card:has(>.ci) h2{padding-right:0}
.ci{display:none}
.glance{background:#fff;border:0;border-radius:0 0 0 30px;box-shadow:none;padding:16px 20px}
.clock{background:var(--ink);border-radius:0}
.tag{border:1.5px solid var(--ink);border-radius:3px;color:var(--ink);font-weight:600;font-size:12px;padding:2px 6px}

/* actions */
.btn{background:var(--gold);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:0;text-transform:none;border-radius:4px;padding:15px 24px;min-height:48px;line-height:1.1;box-shadow:inset 0 0 0 2px var(--ink)}

.btn:active{background:var(--ink);color:var(--gold);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:0;box-shadow:inset 0 0 0 2px var(--ink);font-size:16px;padding:12px 18px}
.btn.ghost:hover{background:var(--ink);color:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.btn[disabled],.btn[disabled]:hover{background:var(--gold);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost[disabled],.btn.ghost[disabled]:hover{background:transparent;color:var(--ink)}
.chip{font-family:var(--text);font-weight:500;font-size:16px;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:10px 16px;min-height:44px}
.chip.sm{min-height:38px;padding:7px 13px;font-size:15px}
.chip:hover:not([disabled]):not([aria-pressed=true]){border-color:var(--ink);background:rgba(15,42,45,.07)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
label{font-weight:600}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:4px}
input[type=text]:hover,input[type=number]:hover,input[type=email]:hover,input[type=password]:hover,select:hover,textarea:hover{border-color:var(--ink)}
input[type=text]:focus,input[type=number]:focus,input[type=email]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(0,194,203,.4)}

/* the next step: a dark panel with one rounded corner and a yellow button */
.hero{background:var(--ink);color:#EEF0ED;border-radius:0 56px 0 0;box-shadow:none;padding:26px 28px 26px;margin:20px 0 26px;max-width:620px}
.hero .kicker{font-family:var(--text);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:#C5D2CF}
.hero h2{font-family:var(--disp);font-weight:700;font-stretch:78%;font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1;letter-spacing:-.02em;color:#EEF0ED;margin:8px 0 10px}
.hero p{color:#EEF0ED;font-size:17px}
.hero a.btn{display:block;width:100%;min-width:0;text-align:center;background:var(--gold);color:var(--ink);font-size:20px;padding:19px 22px;margin-top:16px;box-shadow:none}
.hero a.btn:hover{background:#fff;color:var(--ink)}
.hero .bar{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(238,240,237,.5);height:12px;margin-top:16px;border-radius:0}.hero .bar i{background:var(--gold)}
.hero :focus-visible{outline-color:#fff}
.bar{height:12px;background:transparent;border-radius:0;box-shadow:inset 0 0 0 1.5px rgba(15,42,45,.38)}.bar i{background:var(--ink)}

/* notes become tinted panels with one rounded corner */
.note{border:0;border-radius:0 0 0 24px;padding:14px 18px;color:var(--ink)}
.note.info,.note.ok{background:var(--acc2);border:0}.note.warn{background:var(--warnbg);border:0}.note.bad{background:var(--badbg);border:0;color:var(--bad)}
.lesson{background:#fff;border:0;border-left:0;border-radius:0 0 0 40px;padding:22px 26px}
.lesson h3{font-size:1.5rem;letter-spacing:-.01em}
.lesson p{max-width:64ch}
.ex{background:#fff;border:0;border-left:7px solid var(--gold);border-radius:0;padding:16px 20px}

/* numbered step rows */
.step{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:14px 0;margin:0;gap:14px}
.step:hover{transform:none;box-shadow:none;border-color:var(--line)}
.step:hover .tt{text-decoration:underline;text-underline-offset:4px}
.step .n,.step.g1 .n,.step.g2 .n,.step.g3 .n{width:3rem;height:auto;border-radius:0;background:none;color:var(--ink);font-family:var(--disp);font-weight:300;font-size:2.1rem;line-height:1;justify-content:flex-start}
.step.done .n{background:none;color:#8A9C99}
.step.done .tt{color:var(--mute)}
.step .tt{font-weight:500;font-size:18px}
.step.next{border:0;border-bottom:1px solid var(--line);background:linear-gradient(var(--gold),var(--gold)) left/7px 100% no-repeat;padding-left:20px;box-shadow:none}
.step.next .n,.step.next .tt{font-weight:700}
h3.grp,h3.grp.g1l,h3.grp.g2l,h3.grp.g3l{font:600 14px/1.3 var(--text);letter-spacing:0;text-transform:none;color:var(--mute);border-left:0;padding-left:0;margin:24px 0 2px}
.crow{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0}.crow:hover{border-color:var(--line)}
.pk{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0}

/* numbers as type, not tiles */
.tiles{display:flex;flex-wrap:wrap;gap:10px 44px}
.tile{background:transparent;border:0;border-radius:0;padding:0;text-align:left;align-items:flex-start;font-size:16px;color:var(--ink)}
.tile b{font-family:var(--disp);font-weight:700;font-stretch:78%;font-size:2.6rem;line-height:1}
.tile .ti{display:none}
.stat{background:transparent;border:0;border-radius:0;padding:0;text-align:left;min-width:120px}
.stat b{font-family:var(--disp);font-weight:700;font-stretch:78%}
.score{font-family:var(--disp)}

/* community pieces keep working, in the new palette */
.av{border-color:var(--ink)}
.com-dot{background:var(--gold);border-color:var(--ink)}
@media(min-width:760px){main{padding-top:26px}h1{font-size:clamp(2.1rem,4.4vw,3.3rem)}.card{padding:14px 0 4px}.hero{padding:28px 30px}.hero h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}}
@media(max-width:820px){body{font-size:16px}.hero{border-radius:0 40px 0 0;padding:22px}.btn:not(.ghost){display:block;width:100%;text-align:center}.step .n,.step.g1 .n,.step.g2 .n,.step.g3 .n{width:2.2rem;font-size:1.6rem}.step .tt{font-size:16px}}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json">
    <title>CEO Planner</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/variables.css?v=19">
    <link rel="stylesheet" href="./css/styles.css?v=22">
    <link rel="stylesheet" href="./css/components.css?v=111">
</head>
<body>
    <div id="app-container">
        <!-- Content will be injected here by JS router -->
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading your CEO workspace...</p>
        </div>
    </div>

    <script>
        // Diagnostics go to the console, where they are useful. The customer gets a
        // calm recovery message: a red stack trace over the page reads as "your data
        // is gone" to someone who is not a developer.
        window.addEventListener('error', function (e) {
            console.error('Uncaught error:', e.message, 'at line', e.lineno + ':' + e.colno, e.error);
            if (document.getElementById('ceo-error-banner')) return; // don't stack up
            var banner = document.createElement('div');
            banner.id = 'ceo-error-banner';
            banner.setAttribute('role', 'alert');
            banner.style.cssText = 'position:fixed; left:50%; transform:translateX(-50%); bottom:1.25rem; z-index:9999; max-width:min(28rem, calc(100vw - 2rem)); background:#fff; color:#344054; border:1px solid #EAECF0; border-left:4px solid #B42318; border-radius:8px; padding:0.875rem 1rem; box-shadow:0 8px 20px rgba(16,24,40,0.12); font:400 0.875rem/1.5 system-ui, sans-serif;';
            banner.innerHTML = '<strong style="display:block; color:#101828; margin-bottom:0.2rem;">Something went wrong</strong>' +
                'Your work is saved. Refreshing the page usually sorts it. ' +
                '<button type="button" style="background:none; border:0; padding:0; color:#6941C6; font:inherit; font-weight:600; cursor:pointer; text-decoration:underline;">Refresh</button>';
            banner.querySelector('button').addEventListener('click', function () { window.location.reload(); });
            document.body.appendChild(banner);
        });
    </script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Cloudflare Turnstile (bot protection on the auth forms).
         render=explicit because this is a single page app: the auth screen is
         rebuilt on every hash change, and Turnstile's automatic scanner only
         runs once at page load. js/screens/auth.js mounts the widget itself. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    <!-- Main App Logic -->
    <script src="./js/bundle.js?v=419" defer></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // updateViaCache: 'none' stops the browser serving sw.js itself from its
          // http cache. Safari will otherwise hold a service worker script for up
          // to 24 hours, which means a fix to the caching strategy cannot reach
          // the very browsers that need it — the worker keeping someone on an old
          // build is the same worker that would have to update to release them.
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(reg => {
              console.log('Service Worker installed securely.', reg);
              // Ask for a fresh copy on every load rather than waiting for the
              // browser's own schedule.
              reg.update().catch(() => {});
            })
            .catch(err => console.error('Service Worker installation failed: ', err));
        });
      }

      // Last-resort recovery for a browser already pinned to an old build.
      //
      // Compares the bundle version this page is running against the one the
      // server currently serves, fetched with cache disabled so the answer cannot
      // itself be stale. On a mismatch it reloads once — guarded by sessionStorage
      // so a genuinely broken deploy cannot put the tab in a reload loop.
      //
      // Batch item 19. This used to run ONCE, inside the load event, which meant
      // a tab left open overnight never re-checked and could run old code
      // indefinitely while the live site moved on. That is the likely reason
      // item 18's sync warning never appeared for Jen: the tab reporting the
      // problem was last loaded on v97, before the warning existed. It also
      // undermines every deploy, because someone who lives in a pinned tab gets
      // fixes only when they happen to reload.
      //
      // So it runs on load AND whenever the tab comes back to the foreground,
      // throttled to once every five minutes so ordinary tab-flicking costs
      // nothing. The single-reload guard is unchanged: a genuinely broken deploy
      // still cannot put the tab in a loop, however many times this is called.
      var CEO_BUILD_CHECK_MIN_GAP_MS = 5 * 60 * 1000;
      var ceoLastBuildCheck = 0;

      function ceoCheckForNewBuild() {
        var now = Date.now();
        if (now - ceoLastBuildCheck < CEO_BUILD_CHECK_MIN_GAP_MS) return;
        ceoLastBuildCheck = now;

        var running = (document.querySelector('script[src*="bundle.js"]') || {}).src || '';
        var runningVersion = (running.match(/[?&]v=(\d+)/) || [])[1];
        if (!runningVersion) return;

        // Ask for a fresh service worker on the same schedule. The worker holds
        // the cache list naming the bundle, so a tab reloading onto a new build
        // while its worker still believes in the old one is only half updated.
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration()
            .then(function (reg) { if (reg) reg.update(); })
            .catch(function () {});
        }

        fetch('index.html?cachecheck=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (html) {
            var latest = (html.match(/bundle\.js\?v=(\d+)/) || [])[1];
            if (!latest || latest === runningVersion) return;
            if (sessionStorage.getItem('ceo_stale_reload') === latest) return;
            // Never reload out from under someone mid-sentence. This check now
            // runs on every refocus rather than once per page load, so without
            // this it could throw away a half-written Monday Plan the moment a
            // deploy landed. Leaving the guard unset means the next check, five
            // minutes later, tries again.
            var focused = document.activeElement;
            if (focused && (focused.isContentEditable ||
                ((focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA') && focused.value))) {
              console.warn('New build v' + latest + ' available, holding the reload until the field being typed in is left.');
              return;
            }
            sessionStorage.setItem('ceo_stale_reload', latest);
            console.warn('Running build v' + runningVersion + ', server has v' + latest + '. Reloading.');
            location.reload();
          })
          .catch(function () { /* offline, or the check failed. Carry on. */ });
      }

      window.ceoCheckForNewBuild = ceoCheckForNewBuild;

      window.addEventListener('load', ceoCheckForNewBuild);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') ceoCheckForNewBuild();
      });
    </script>
</body>

</html>
